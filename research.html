<!DOCTYPE html>
<html>

<head>

<title>CivilDiscourse Research</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

/* NAVBAR */

header{
background:#1f2d3d;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
}


/* LAYOUT */

.container{
display:grid;
grid-template-columns:3fr 1fr;
gap:30px;
padding:30px;
}


/* RESEARCH CARD */

.research{
background:white;
padding:25px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.research h2{
margin-top:0;
}

.meta{
font-size:14px;
color:#666;
margin-bottom:10px;
}

.abstract{
color:#444;
margin-bottom:15px;
line-height:1.6;
}

.content{
font-size:15px;
color:#333;
}


/* SEARCH PANEL */

.sidebar{
background:white;
padding:20px;
border-radius:8px;
height:fit-content;
}

.sidebar input{
width:100%;
padding:10px;
border:1px solid #ccc;
margin-bottom:10px;
}

</style>

</head>



<body>



<header>

<h2>CivilDiscourse</h2>

<nav>

<a href="index.html">Home</a>
<a href="research.html">Research</a>
<a href="articles.html">Articles</a>
<a href="about.html">About</a>

</nav>

</header>



<div class="container">


<!-- RESEARCH LIST -->

<div id="researchList"></div>



<!-- SEARCH PANEL -->

<div class="sidebar">

<h3>Search Research</h3>

<input id="search" placeholder="Search research topic...">

<p style="font-size:14px;color:gray">

Search by title, author, category or abstract.

</p>

</div>


</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>



<script>

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyBuDbslgaInn-UoWR1F-Z7_MZfw7JO5F4w",
  authDomain: "civildiscourse-a453d.firebaseapp.com",
  projectId: "civildiscourse-a453d",
  storageBucket: "civildiscourse-a453d.firebasestorage.app",
  messagingSenderId: "615565870121",
  appId: "1:615565870121:web:46e5db45842435a1a1c838",
  measurementId: "G-21QJRQK7GF"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let allResearch=[];


/* LOAD RESEARCH */

db.collection("research")
.orderBy("date","desc")
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{

let data=doc.data()

allResearch.push(data)

renderResearch(allResearch)

})

})



/* RENDER RESEARCH */

function renderResearch(list){

let container=document.getElementById("researchList")

container.innerHTML=""

list.forEach(post=>{

container.innerHTML+=`

<div class="research">

<h2>${post.title}</h2>

<div class="meta">

Author: ${post.author} | Category: ${post.category}

</div>

<div class="abstract">

${post.abstract}

</div>

<div class="content">

${post.content}

</div>

</div>

`

})

}



/* SEARCH FUNCTION */

document.getElementById("search").addEventListener("input",function(){

let text=this.value.toLowerCase()

let filtered=allResearch.filter(post=>

post.title.toLowerCase().includes(text) ||

post.author.toLowerCase().includes(text) ||

post.category.toLowerCase().includes(text) ||

post.abstract.toLowerCase().includes(text)

)

renderResearch(filtered)

})

</script>



</body>

</html>
