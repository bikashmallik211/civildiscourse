<!DOCTYPE html>
<html>

<head>

<title>CivilDiscourse Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

/* LOGIN */

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#1f2d3d;
}

.login-box{
background:white;
padding:40px;
width:320px;
border-radius:8px;
text-align:center;
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
}

.login-box button{
width:100%;
padding:10px;
background:#1f2d3d;
color:white;
border:none;
cursor:pointer;
}

/* DASHBOARD */

#dashboard{
display:none;
padding:30px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input,textarea,select{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
}

textarea{
height:150px;
}

button{
background:#1f2d3d;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
margin-top:5px;
}

.clock{
font-size:28px;
font-weight:bold;
}

.postItem{
border-bottom:1px solid #ddd;
padding:10px 0;
}

.postItem button{
margin-right:5px;
}

</style>

</head>

<body>


<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-box">

<h2>Admin Login</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

</div>



<!-- DASHBOARD -->

<div id="dashboard">

<h1>CivilDiscourse Admin Dashboard</h1>

<div class="grid">


<!-- LEFT SIDE -->

<div>


<div class="card">

<h3>Create / Edit Post</h3>

<select id="page">

<option value="articles">Articles Page</option>
<option value="research">Research Page</option>

</select>

<input id="title" placeholder="Title">

<input id="author" placeholder="Author">

<input id="category" placeholder="Category">

<textarea id="abstract" placeholder="Abstract"></textarea>

<textarea id="content" placeholder="Full Content"></textarea>

<button onclick="publish()">Publish / Update</button>

</div>



<div class="card">

<h3>Manage Posts</h3>

<div id="postList"></div>

</div>



<div class="card">

<h3>Recent Comments</h3>

<div id="commentList"></div>

</div>


</div>



<!-- RIGHT PANEL -->

<div>


<div class="card">

<h3>Digital Clock</h3>

<div class="clock" id="clock"></div>

</div>



<div class="card">

<h3>Calendar</h3>

<input type="date">

</div>



<div class="card">

<h3>Analytics</h3>

<p>Total Articles: <span id="totalArticles">0</span></p>

<p>Total Research Posts: <span id="totalResearch">0</span></p>

<p>Total Comments: <span id="totalComments">0</span></p>

</div>


</div>


</div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyBuDbslgaInn-UoWR1F-Z7_MZfw7JO5F4w",
  authDomain: "civildiscourse-a453d.firebaseapp.com",
  projectId: "civildiscourse-a453d",
  storageBucket: "civildiscourse-a453d.firebasestorage.app",
  messagingSenderId: "615565870121",
  appId: "1:615565870121:web:46e5db45842435a1a1c838",
  measurementId: "G-21QJRQK7GF"

}

firebase.initializeApp(firebaseConfig)

const auth=firebase.auth()

const db=firebase.firestore()



/* LOGIN */

function login(){

let email=document.getElementById("email").value
let password=document.getElementById("password").value

auth.signInWithEmailAndPassword(email,password)

.then(()=>{

document.getElementById("loginPage").style.display="none"
document.getElementById("dashboard").style.display="block"

loadAnalytics()
loadComments()
loadPosts()

})

.catch(e=>alert(e.message))

}



/* PUBLISH OR UPDATE */

function publish(){

let page=document.getElementById("page").value

let data={

title:document.getElementById("title").value,
author:document.getElementById("author").value,
category:document.getElementById("category").value,
abstract:document.getElementById("abstract").value,
content:document.getElementById("content").value,
date:new Date()

}

if(window.editingId){

db.collection(page).doc(window.editingId).update(data)

.then(()=>{

alert("Post Updated")
window.editingId=null
loadPosts()

})

}

else{

db.collection(page).add(data)

.then(()=>{

alert("Post Published")
loadPosts()

})

}

}



/* LOAD POSTS */

function loadPosts(){

let container=document.getElementById("postList")

container.innerHTML=""

db.collection("articles").get().then(snapshot=>{

snapshot.forEach(doc=>{

let post=doc.data()

container.innerHTML+=`

<div class="postItem">

<b>${post.title}</b>

<br>

<button onclick="editPost('${doc.id}')">Edit</button>

<button onclick="deletePost('${doc.id}')">Delete</button>

</div>

`

})

})

}



/* EDIT POST */

function editPost(id){

db.collection("articles").doc(id).get()

.then(doc=>{

let post=doc.data()

document.getElementById("title").value=post.title
document.getElementById("author").value=post.author
document.getElementById("category").value=post.category
document.getElementById("abstract").value=post.abstract
document.getElementById("content").value=post.content

window.editingId=id

})

}



/* DELETE POST */

function deletePost(id){

if(confirm("Delete this post?")){

db.collection("articles").doc(id).delete()

.then(()=>{

alert("Post Deleted")
loadPosts()

})

}

}



/* ANALYTICS */

function loadAnalytics(){

db.collection("articles").get().then(s=>{
document.getElementById("totalArticles").innerText=s.size
})

db.collection("research").get().then(s=>{
document.getElementById("totalResearch").innerText=s.size
})

db.collection("comments").get().then(s=>{
document.getElementById("totalComments").innerText=s.size
})

}



/* LOAD COMMENTS */

function loadComments(){

db.collection("comments")
.orderBy("date","desc")
.limit(5)
.get()
.then(snapshot=>{

let container=document.getElementById("commentList")

container.innerHTML=""

snapshot.forEach(doc=>{

let c=doc.data()

container.innerHTML+=`

<p><b>${c.name}</b>: ${c.message}</p>

`

})

})

}



/* DIGITAL CLOCK */

setInterval(()=>{

let now=new Date()

document.getElementById("clock").innerText=now.toLocaleTimeString()

},1000)

</script>


</body>

</html>
