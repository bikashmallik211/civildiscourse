<!DOCTYPE html>
<html>

<head>

<title>CivilDiscourse Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

/* LOGIN */

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#1f2d3d;
}

.login-box{
background:white;
padding:40px;
width:320px;
border-radius:8px;
text-align:center;
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
}

.login-box button{
width:100%;
padding:10px;
background:#1f2d3d;
color:white;
border:none;
cursor:pointer;
}


/* DASHBOARD */

#dashboard{
display:none;
padding:30px;
}

.editor{
background:white;
padding:25px;
border-radius:8px;
max-width:900px;
margin:auto;
}

input,textarea,select{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
}

textarea{
height:200px;
}

.toolbar button{
padding:6px 10px;
margin-right:5px;
}

button{
background:#1f2d3d;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
}

</style>

</head>



<body>


<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

</div>



<!-- DASHBOARD -->

<div id="dashboard">

<h1>CivilDiscourse Admin Editor</h1>

<div class="editor">


<h3>Create Post / Article</h3>


<label>Publish To Page</label>

<select id="page">

<option value="research">Research Page</option>
<option value="articles">Articles Page</option>
<option value="resources">Resources Page</option>
<option value="news">News Page</option>

</select>



<label>Title</label>

<input id="title" placeholder="Post Title">


<label>Author</label>

<input id="author" placeholder="Author Name">


<label>Category</label>

<input id="category" placeholder="Example: Governance">


<label>Abstract / Summary</label>

<textarea id="abstract"></textarea>


<label>Article Content</label>

<div class="toolbar">

<button onclick="format('bold')"><b>B</b></button>
<button onclick="format('italic')"><i>I</i></button>
<button onclick="format('underline')"><u>U</u></button>

</div>

<textarea id="content"></textarea>



<button onclick="publish()">Publish Post</button>

</div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>



<script>

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyBuDbslgaInn-UoWR1F-Z7_MZfw7JO5F4w",
  authDomain: "civildiscourse-a453d.firebaseapp.com",
  projectId: "civildiscourse-a453d",
  storageBucket: "civildiscourse-a453d.firebasestorage.app",
  messagingSenderId: "615565870121",
  appId: "1:615565870121:web:46e5db45842435a1a1c838",
  measurementId: "G-21QJRQK7GF"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();



/* LOGIN */

function login(){

let email=document.getElementById("email").value

let password=document.getElementById("password").value

auth.signInWithEmailAndPassword(email,password)

.then(()=>{

document.getElementById("loginPage").style.display="none"

document.getElementById("dashboard").style.display="block"

})

.catch(error=>alert(error.message))

}



/* TEXT FORMATTING */

function format(type){

let textarea=document.getElementById("content")

let start=textarea.selectionStart

let end=textarea.selectionEnd

let selected=textarea.value.substring(start,end)

let before=textarea.value.substring(0,start)

let after=textarea.value.substring(end)

if(type=="bold"){
textarea.value=before+"<b>"+selected+"</b>"+after
}

if(type=="italic"){
textarea.value=before+"<i>"+selected+"</i>"+after
}

if(type=="underline"){
textarea.value=before+"<u>"+selected+"</u>"+after
}

}



/* PUBLISH POST */

function publish(){

let page=document.getElementById("page").value

let title=document.getElementById("title").value

let author=document.getElementById("author").value

let category=document.getElementById("category").value

let abstract=document.getElementById("abstract").value

let content=document.getElementById("content").value



db.collection(page).add({

title:title,
author:author,
category:category,
abstract:abstract,
content:content,
date:new Date()

})

.then(()=>{

alert("Post Published Successfully")

})

}

</script>


</body>

</html>
