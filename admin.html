<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CivilDiscourse Admin</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background:#f4f6f9;
}

/* LOGIN PAGE */

#loginPage{
display:flex;
height:100vh;
justify-content:center;
align-items:center;
background:#1f2d3d;
}

.login-box{
background:white;
padding:40px;
width:320px;
border-radius:8px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.login-box input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
}

.login-box button{
width:100%;
padding:10px;
background:#1f2d3d;
color:white;
border:none;
cursor:pointer;
}

/* DASHBOARD */

#dashboard{
display:none;
}

header{
background:#1f2d3d;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input, textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
}

button{
background:#1f2d3d;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:20px;
}

.stat-box{
background:#eef2f6;
padding:20px;
text-align:center;
border-radius:6px;
}

</style>

</head>

<body>


<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-box">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Admin Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

</div>



<!-- DASHBOARD -->

<div id="dashboard">

<header>

<h2>CivilDiscourse Admin</h2>

<button onclick="logout()">Logout</button>

</header>


<div class="container">


<!-- CREATE POST -->

<div class="card">

<h3>Create Article</h3>

<input type="text" placeholder="Post Title">

<textarea placeholder="Write article content"></textarea>

<button>Publish Post</button>

</div>



<!-- UPLOAD RESEARCH -->

<div class="card">

<h3>Upload Research Paper</h3>

<input type="text" placeholder="Research Title">

<input type="text" placeholder="Author">

<textarea placeholder="Abstract"></textarea>

<input type="file">

<button>Upload PDF</button>

</div>



<!-- UPLOAD RESOURCES -->

<div class="card">

<h3>Upload Study Resources</h3>

<input type="file">

<button>Upload Resource</button>

</div>



<!-- ANALYTICS -->

<div class="card">

<h3>Website Analytics</h3>

<div class="stats">

<div class="stat-box">
<h3>0</h3>
<p>Visitors</p>
</div>

<div class="stat-box">
<h3>0</h3>
<p>Research Papers</p>
</div>

<div class="stat-box">
<h3>0</h3>
<p>Downloads</p>
</div>

<div class="stat-box">
<h3>0</h3>
<p>Comments</p>
</div>

</div>

</div>



<!-- COMMENTS -->

<div class="card">

<h3>Manage Comments</h3>

<p>No comments yet</p>

</div>


</div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>


<script>

/* YOUR FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();



/* LOGIN FUNCTION */

function login(){

let email=document.getElementById("email").value

let password=document.getElementById("password").value

auth.signInWithEmailAndPassword(email,password)

.then(()=>{

document.getElementById("loginPage").style.display="none"

document.getElementById("dashboard").style.display="block"

})

.catch((error)=>{

alert(error.message)

})

}



/* LOGOUT */

function logout(){

auth.signOut()

location.reload()

}

</script>


</body>

</html>
